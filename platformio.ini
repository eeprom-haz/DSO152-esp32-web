[platformio]
default_envs = esp32c3

[env]
platform = espressif32
framework = arduino
board_build.partitions = huge_app.csv
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps =
    tzapu/WiFiManager@^2.0.17
    links2004/WebSockets@^2.6.1
    knolleary/PubSubClient@^2.8

; ESP-WROOM-32 DevKit: SWCLK GPIO18, SWDIO GPIO19
[env:esp32dev]
board = esp32dev
upload_speed = 921600
build_flags = -DPIN_SWCLK=18 -DPIN_SWDIO=19

; ESP32-C3 (e.g. SuperMini): SWCLK GPIO4, SWDIO GPIO5, serial over native USB
[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags =
    -DPIN_SWCLK=4
    -DPIN_SWDIO=5
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
